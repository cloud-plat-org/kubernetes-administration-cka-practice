apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginx
  name: nginx
spec:
  containers:
  - image: nginx
    name: nginx
    resources: 
      requests:
        memory: "1Gi"
        cpu: 2
      limits:
        memory: "2Gi"
        cpu: 3
    env:
    - name: NAME
      value: "Nginx"
    # or 
    envFrom:
    - configMapRef:
        name: app-config
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
