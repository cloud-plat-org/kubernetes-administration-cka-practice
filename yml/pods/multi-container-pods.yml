apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
    - name: nginx
      image: nginx
    - name: busybox 
      image: busybox
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 100m

# co-location of the containers (two containers in the same pod depends on each other)
# regular init container (waits until a db has started then starts the app container)
# sidecar container (runs a service and a helper tool - usually a logger)